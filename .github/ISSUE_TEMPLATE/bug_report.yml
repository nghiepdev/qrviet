name: Bug report
description: Something in QRViet does not work as expected.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem! Please search the existing issues first.

        **Privacy:** do not post real account numbers, names, QR codes or screenshots with personal data. Use made-up values or blur them.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Scan page
        2. Paste a screenshot with Ctrl+V
        3. …
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Create VietQR
        - Scan and decode
        - Payment links
        - Batch
        - QR studio
        - Account book or history
        - Bank list
        - Themes, settings or language
        - Install, offline or updates (PWA)
        - Something else
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: How do you use QRViet?
      options:
        - In a browser tab
        - As an installed app (PWA)
        - From a local build (pnpm dev or pnpm preview)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Device, operating system and browser
      placeholder: iPhone 15, iOS 26.1, Safari
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown under Settings → App (Cài đặt → Ứng dụng). Use the commit hash for a local build.
      placeholder: 1.0.0

  - type: textarea
    id: details
    attributes:
      label: Screenshots, QR strings or console errors
      description: Anything else that helps. Remove personal data first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This report contains no real account numbers or other personal data.
          required: true
